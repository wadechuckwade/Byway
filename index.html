<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>Byway — Region Query Test v2</title>
<style>
  body { background:#111; color:#eee; font-family:monospace; padding:24px; max-width:900px; }
  button { padding:10px 18px; background:#238636; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; margin-bottom:8px; margin-right:6px; }
  .row { padding:10px 14px; background:#1a1a2e; border-radius:8px; margin-bottom:6px; }
  .label { font-size:11px; color:#888; margin-bottom:4px; }
  .val { font-size:12px; color:#3fb950; word-break:break-word; line-height:1.5; }
  .fail { color:#f85149; }
  .grid { display:grid; gap:3px; margin-top:10px; }
  .cell { height:70px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:9px; text-align:center; padding:3px; line-height:1.5; }
</style>
</head>
<body>
<h2 style="margin-bottom:6px">Byway — Region Grid v2</h2>
<p style="color:#555;font-size:12px;margin-bottom:18px">Fixed grid scoring. Dropped highway query for speed. Tests POI density grid used for route pathfinding.</p>
<button onclick="runTest('edinburgh')">Edinburgh→Inverness</button>
<button onclick="runTest('lakes')">Lake District</button>
<button onclick="runTest('cotswolds')">Cotswolds</button>
<div id="out"></div>

<script>
const REGIONS = {
  edinburgh: { name:'Edinburgh→Inverness', lat1:55.953,lon1:-3.188, lat2:57.477,lon2:-4.224, pad:0.5 },
  lakes:     { name:'Lake District',       lat1:54.2,  lon1:-3.5,   lat2:54.7, lon2:-2.7,   pad:0.1 },
  cotswolds: { name:'Cotswolds',           lat1:51.7,  lon1:-2.1,   lat2:52.1, lon2:-1.5,   pad:0.1 },
};

function log(label, val, ok=true) {
  document.getElementById('out').insertAdjacentHTML('beforeend',
    `<div class="row"><div class="label">${label}</div><div class="val ${ok?'':'fail'}">${val}</div></div>`);
}

async function queryRegion(minLat, minLon, maxLat, maxLon) {
  // No highway query — too slow. Get road data from OSRM steps instead.
  const b = `${minLat},${minLon},${maxLat},${maxLon}`;
  const q = `[out:json][timeout:25];(
    node["tourism"="viewpoint"](${b});
    node["natural"="peak"]["name"](${b});
    node["natural"="waterfall"]["name"](${b});
    node["historic"="castle"]["name"](${b});
    node["historic"="ruins"]["name"](${b});
    node["amenity"="pub"]["name"](${b});
    node["amenity"="cafe"]["name"](${b});
    node["amenity"="restaurant"]["name"](${b});
    way["natural"="water"]["name"](${b});
    way["natural"="coastline"](${b});
  );out center 300;`;

  const r = await fetch('https://overpass.kumi.systems/api/interpreter', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(q)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return (await r.json()).elements || [];
}

function scoreGrid(els, minLat, minLon, maxLat, maxLon, W=4, H=4) {
  const cw = (maxLon - minLon) / W;
  const ch = (maxLat - minLat) / H;

  const grid = Array.from({length: W*H}, (_, i) => ({
    row: Math.floor(i/W), col: i%W,
    views:0, peaks:0, water:0, castles:0, food:0, coast:0,
    score:0, names:[], topPOIs:[]
  }));

  for (const el of els) {
    const lat = el.lat ?? el.center?.lat;
    const lon = el.lon ?? el.center?.lon;
    if (lat == null || lon == null) continue;

    const col = Math.min(W-1, Math.max(0, Math.floor((lon - minLon) / cw)));
    const row = Math.min(H-1, Math.max(0, Math.floor((lat - minLat) / ch)));
    const c = grid[row * W + col];

    const t = el.tags || {};
    if (t.tourism === 'viewpoint')                    { c.views++;   if(t.name) c.topPOIs.push({name:t.name, type:'viewpoint'}); }
    if (t.natural === 'peak')                         { c.peaks++;   if(t.name) c.topPOIs.push({name:t.name, type:'peak', lat, lon}); }
    if (t.natural === 'waterfall' || t.natural==='water') { c.water++; if(t.name) c.topPOIs.push({name:t.name, type:'water', lat, lon}); }
    if (t.historic === 'castle' || t.historic==='ruins')  { c.castles++; if(t.name) c.topPOIs.push({name:t.name, type:'castle', lat, lon}); }
    if (t.amenity === 'pub' || t.amenity==='cafe' || t.amenity==='restaurant') { c.food++; if(t.name) c.topPOIs.push({name:t.name, type:t.amenity, lat, lon}); }
    if (t.natural === 'coastline')                    c.coast++;
    if (t.name) c.names.push(t.name);
  }

  for (const c of grid) {
    c.score = Math.min(100,
      c.views   * 10 +
      c.peaks   * 8  +
      c.water   * 7  +
      c.castles * 12 +
      c.food    * 3  +
      c.coast   * 6
    );
  }
  return grid;
}

// Simple pathfinding: find best scoring path of cells from start region to end region
function findBestPath(grid, W, H, startCol, endCol) {
  // Dynamic programming: best score to reach each cell
  const dp = Array(W*H).fill(0);
  const prev = Array(W*H).fill(-1);

  // Start from bottom row (south), work north row by row
  // Actually just find top-N cells and order them south→north
  const sorted = [...grid].sort((a,b) => b.score - a.score);
  const topCells = sorted.slice(0, Math.min(6, sorted.length));

  // Order by latitude (row) to form a path south→north
  topCells.sort((a,b) => a.row - b.row);
  return topCells;
}

function renderGrid(grid, W, H) {
  const max = Math.max(...grid.map(c=>c.score), 1);
  let html = `<div class="grid" style="grid-template-columns:repeat(${W},1fr)">`;
  for (let row = H-1; row >= 0; row--) {
    for (let col = 0; col < W; col++) {
      const c = grid[row*W+col];
      const t = c.score/max;
      const g = Math.round(60 + t*195);
      const r2 = Math.round(10 + t*30);
      const bg = `rgb(${r2},${g},${Math.round(20+t*20)})`;
      const textColor = t > 0.45 ? '#000' : '#999';
      const top2 = c.names.slice(0,2).join('\n') || '—';
      html += `<div class="cell" style="background:${bg};color:${textColor}">
        <div><b>${c.score}</b><br/>
        👁${c.views} 🏔${c.peaks}<br/>
        💧${c.water} 🏰${c.castles} 🍺${c.food}<br/>
        <span style="font-size:8px">${top2}</span></div>
      </div>`;
    }
  }
  return html + '</div>';
}

async function runTest(key) {
  document.getElementById('out').innerHTML = '';
  const reg = REGIONS[key];
  const pad = reg.pad;
  const minLat = Math.min(reg.lat1,reg.lat2) - pad;
  const maxLat = Math.max(reg.lat1,reg.lat2) + pad;
  const minLon = Math.min(reg.lon1,reg.lon2) - pad;
  const maxLon = Math.max(reg.lon1,reg.lon2) + pad;

  log('Region', reg.name);
  log('Bounding box', `${minLat.toFixed(2)},${minLon.toFixed(2)} → ${maxLat.toFixed(2)},${maxLon.toFixed(2)}`);

  try {
    const t0 = Date.now();
    const els = await queryRegion(minLat, minLon, maxLat, maxLon);
    const elapsed = ((Date.now()-t0)/1000).toFixed(1);
    log('Query time', elapsed + 's');
    log('Total elements', els.length);

    const counts = {};
    for (const el of els) {
      const t = el.tags||{};
      const k = t.tourism||t.natural||t.historic||t.amenity||'?';
      counts[k] = (counts[k]||0)+1;
    }
    log('By type', Object.entries(counts).map(([k,v])=>`${k}:${v}`).join(' | '));

    const named = els.filter(e=>e.tags?.name).slice(0,10).map(e=>e.tags.name);
    log('Sample names', named.join(', ')||'none');

    const W=4, H=4;
    const grid = scoreGrid(els, minLat, minLon, maxLat, maxLon, W, H);
    const top = [...grid].sort((a,b)=>b.score-a.score).slice(0,4);
    log('Top scoring cells',
      top.map(c=>`[r${c.row}c${c.col}] ${c.score}pts — ${c.names.slice(0,3).join(', ')||'unnamed'}`).join('\n'));

    // Show best path through grid
    const path = findBestPath(grid, W, H, 0, W-1);
    log('Suggested route path',
      path.map(c=>`[r${c.row}c${c.col}]${c.score}pts`).join(' → '));

    // Show best named POIs overall
    const allPOIs = grid.flatMap(c=>c.topPOIs);
    const topPOIs = allPOIs
      .filter((p,i,a)=>a.findIndex(x=>x.name===p.name)===i)
      .slice(0,8)
      .map(p=>`${p.name} (${p.type})`);
    log('Best named POIs for waypoints', topPOIs.join(', ')||'none');

    document.getElementById('out').insertAdjacentHTML('beforeend',
      `<div class="row"><div class="label">4×4 Score Grid — N at top, brighter = more scenic/interesting</div>${renderGrid(grid,W,H)}</div>`);

  } catch(e) {
    log('FAILED', e.message, false);
  }
}
</script>
</body>
</html>
