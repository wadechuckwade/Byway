<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>Byway — Minimal API Test</title>
<style>
  body { background:#111; color:#eee; font-family:monospace; padding:24px; }
  button { padding:10px 18px; background:#238636; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; margin:4px; }
  .row { padding:10px 14px; background:#1a1a2e; border-radius:8px; margin-bottom:6px; font-size:12px; }
  .ok { color:#3fb950; } .fail { color:#f85149; }
</style>
</head>
<body>
<h2>Minimal API Tests</h2>
<p style="color:#555;font-size:12px;margin-bottom:16px">Each button tests one thing in isolation.</p>

<button onclick="t1()">1. Overpass — tiny query (5 nodes)</button>
<button onclick="t2()">2. Overpass — small bbox (viewpoints only)</button>
<button onclick="t3()">3. Overpass — small bbox (peaks only)</button>
<button onclick="t4()">4. Overpass — small bbox (pubs only)</button>
<button onclick="t5()">5. Overpass — overpass.openstreetmap.ru instead</button>
<button onclick="t6()">6. Geoapify places — large radius</button>
<button onclick="t7()">7. OSRM route</button>

<div id="out"></div>
<script>
function log(label, val, ok=true) {
  document.getElementById('out').insertAdjacentHTML('beforeend',
    `<div class="row"><b>${label}:</b> <span class="${ok?'ok':'fail'}">${val}</span></div>`);
}

async function overpass(q, label) {
  try {
    const t0=Date.now();
    const r = await fetch('https://overpass.kumi.systems/api/interpreter',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data='+encodeURIComponent(q)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    log(label, `✅ ${d.elements?.length} elements in ${((Date.now()-t0)/1000).toFixed(1)}s`);
  } catch(e) { log(label, '❌ '+e.message, false); }
}

async function t1() {
  await overpass(`[out:json][timeout:10];node["tourism"="viewpoint"](54.4,−3.1,54.5,−3.0);out 5;`, '1. Tiny query');
}
async function t2() {
  await overpass(`[out:json][timeout:10];node["tourism"="viewpoint"](54.3,-3.3,54.6,-2.8);out 20;`, '2. Viewpoints small bbox');
}
async function t3() {
  await overpass(`[out:json][timeout:10];node["natural"="peak"]["name"](54.3,-3.3,54.6,-2.8);out 20;`, '3. Peaks small bbox');
}
async function t4() {
  await overpass(`[out:json][timeout:10];node["amenity"="pub"]["name"](54.3,-3.3,54.6,-2.8);out 20;`, '4. Pubs small bbox');
}
async function t5() {
  try {
    const q = `[out:json][timeout:10];node["tourism"="viewpoint"](54.3,-3.3,54.6,-2.8);out 5;`;
    const t0=Date.now();
    const r = await fetch('https://overpass.openstreetmap.ru/api/interpreter',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data='+encodeURIComponent(q)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    log('5. overpass.openstreetmap.ru', `✅ ${d.elements?.length} elements in ${((Date.now()-t0)/1000).toFixed(1)}s`);
  } catch(e) { log('5. overpass.openstreetmap.ru', '❌ '+e.message, false); }
}
async function t6() {
  try {
    const t0=Date.now();
    const r = await fetch('https://api.geoapify.com/v2/places?categories=natural.mountain,heritage,catering.pub&filter=circle:-3.1,54.45,30000&limit=20&apiKey=226000c0710244c891267056dc9a528b');
    const d = await r.json();
    const names = d.features?.filter(f=>f.properties?.name).slice(0,5).map(f=>f.properties.name);
    log('6. Geoapify places large radius', `✅ ${d.features?.length} features in ${((Date.now()-t0)/1000).toFixed(1)}s — ${names?.join(', ')}`);
  } catch(e) { log('6. Geoapify places', '❌ '+e.message, false); }
}
async function t7() {
  try {
    const t0=Date.now();
    const r = await fetch('https://router.project-osrm.org/route/v1/driving/-3.188,55.953;-4.224,57.477?overview=full&geometries=geojson&steps=true');
    const d = await r.json();
    if(d.code!=='Ok') throw new Error(d.code);
    const steps = d.routes[0].legs[0].steps;
    const roadTypes = [...new Set(steps.map(s=>s.name).filter(Boolean))].slice(0,5);
    log('7. OSRM route', `✅ ${Math.round(d.routes[0].distance/1000)}km, ${steps.length} steps, roads: ${roadTypes.join(', ')}`);
  } catch(e) { log('7. OSRM', '❌ '+e.message, false); }
}
</script>
</body>
</html>
