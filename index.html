<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>API Test</title>
<style>
  body { background:#111; color:#eee; font-family:monospace; padding:32px; }
  button { padding:12px 24px; background:#238636; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; margin-bottom:24px; }
  .row { padding:12px 16px; background:#1a1a2e; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .name { font-size:13px; color:#ccc; }
  .result { font-size:12px; max-width:60%; text-align:right; word-break:break-word; }
  .ok { color:#3fb950; } .fail { color:#f85149; } .pending { color:#888; }
</style>
</head>
<body>
<h2 style="margin-bottom:8px">Byway API Test</h2>
<p style="color:#666;font-size:13px;margin-bottom:24px">Testing all APIs needed for the segment scoring engine.</p>
<button onclick="runAll()">Run All Tests</button>
<div id="tests"></div>
<script>
const TESTS = [
  {
    name: "Geoapify — Geocoding",
    fn: async () => {
      const r = await fetch("https://api.geoapify.com/v1/geocode/search?text=Edinburgh,UK&format=json&limit=1&apiKey=226000c0710244c891267056dc9a528b");
      const d = await r.json();
      if(!d.results?.length) throw new Error("No results");
      return `✅ ${d.results[0].city} (${d.results[0].lat.toFixed(3)}, ${d.results[0].lon.toFixed(3)})`;
    }
  },
  {
    name: "Geoapify — Named POIs (viewpoints near Edinburgh)",
    fn: async () => {
      const r = await fetch("https://api.geoapify.com/v2/places?categories=natural.mountain,tourism.attraction,heritage&filter=circle:-3.1883,55.9533,20000&limit=5&apiKey=226000c0710244c891267056dc9a528b");
      const d = await r.json();
      const named = d.features?.filter(f => f.properties?.name).map(f => f.properties.name).slice(0,3);
      return `✅ ${named?.join(', ')||'no named results'}`;
    }
  },
  {
    name: "Overpass kumi.systems — Viewpoints near Edinburgh",
    fn: async () => {
      const q = `[out:json][timeout:10];node["tourism"="viewpoint"]["name"](around:15000,55.9533,-3.1883);out 5;`;
      const r = await fetch("https://overpass.kumi.systems/api/interpreter", {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(q)
      });
      const d = await r.json();
      const names = d.elements?.filter(e=>e.tags?.name).map(e=>e.tags.name).slice(0,3);
      return `✅ ${names?.join(', ')||'none named'} (${d.elements?.length} total)`;
    }
  },
  {
    name: "Overpass kumi.systems — Castles near Edinburgh",
    fn: async () => {
      const q = `[out:json][timeout:10];node["historic"="castle"]["name"](around:30000,55.9533,-3.1883);out 5;`;
      const r = await fetch("https://overpass.kumi.systems/api/interpreter", {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(q)
      });
      const d = await r.json();
      const names = d.elements?.filter(e=>e.tags?.name).map(e=>e.tags.name).slice(0,3);
      return `✅ ${names?.join(', ')||'none named'} (${d.elements?.length} total)`;
    }
  },
  {
    name: "Overpass kumi.systems — Water bodies near Lake District",
    fn: async () => {
      const q = `[out:json][timeout:10];(way["natural"="water"]["name"](around:15000,54.4609,-3.0886);relation["natural"="water"]["name"](around:15000,54.4609,-3.0886););out center 5;`;
      const r = await fetch("https://overpass.kumi.systems/api/interpreter", {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(q)
      });
      const d = await r.json();
      const names = d.elements?.filter(e=>e.tags?.name).map(e=>e.tags.name).slice(0,3);
      return `✅ ${names?.join(', ')||'none'} (${d.elements?.length} total)`;
    }
  },
  {
    name: "Overpass kumi.systems — Road types on segment",
    fn: async () => {
      const q = `[out:json][timeout:10];way["highway"~"secondary|unclassified|track"]["name"](around:5000,54.4609,-3.0886);out 5;`;
      const r = await fetch("https://overpass.kumi.systems/api/interpreter", {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(q)
      });
      const d = await r.json();
      const names = d.elements?.map(e=>`${e.tags?.name||'unnamed'} (${e.tags?.highway})`).slice(0,3);
      return `✅ ${names?.join(', ')||'none'} (${d.elements?.length} total)`;
    }
  },
  {
    name: "Overpass kumi.systems — Land use near Cotswolds",
    fn: async () => {
      const q = `[out:json][timeout:10];(way["landuse"~"forest|farmland|meadow"](around:10000,51.8,−1.8);way["natural"~"wood|heath|moor"](around:10000,51.8,-1.8););out center 5;`;
      const r = await fetch("https://overpass.kumi.systems/api/interpreter", {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(q)
      });
      const d = await r.json();
      return `✅ ${d.elements?.length} land use features`;
    }
  },
  {
    name: "OpenTopoData — Elevation (SRTM) for 5 points",
    fn: async () => {
      const locs = "55.9533,-3.1883|54.4609,-3.0886|51.8,-1.8|57.2,-5.4|53.4,-3.0";
      const r = await fetch(`https://api.opentopodata.org/v1/srtm90m?locations=${locs}`);
      const d = await r.json();
      if(d.status !== "OK") throw new Error(d.error||"Bad status");
      const elevs = d.results.map(r => Math.round(r.elevation)+"m").join(', ');
      return `✅ ${elevs}`;
    }
  },
  {
    name: "OSRM — Route with road step data (A to B)",
    fn: async () => {
      const r = await fetch("https://router.project-osrm.org/route/v1/driving/-3.1883,55.9533;-3.5,56.2?overview=full&geometries=geojson&steps=true&annotations=true");
      const d = await r.json();
      if(d.code!=="Ok") throw new Error("No route");
      const steps = d.routes[0].legs[0].steps.length;
      const dist = Math.round(d.routes[0].distance/1000);
      const coords = d.routes[0].geometry.coordinates.length;
      return `✅ ${dist}km, ${steps} steps, ${coords} geometry points`;
    }
  },
  {
    name: "OSRM — Match API (snap points to roads)",
    fn: async () => {
      const r = await fetch("https://router.project-osrm.org/match/v1/driving/-3.1883,55.9533;-3.3,55.95;-3.5,56.2?overview=full&geometries=geojson");
      const d = await r.json();
      if(!d.matchings?.length) throw new Error("No match: "+d.code);
      return `✅ Matched ${d.matchings[0].geometry.coordinates.length} points`;
    }
  },
];

async function runAll() {
  const container = document.getElementById('tests');
  container.innerHTML = '';
  for(const test of TESTS) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="name">${test.name}</span><span class="result pending">⏳ testing…</span>`;
    container.appendChild(row);
    const res = row.querySelector('.result');
    try {
      const out = await test.fn();
      res.className = 'result ok';
      res.textContent = out;
    } catch(e) {
      res.className = 'result fail';
      res.textContent = '❌ ' + e.message;
    }
  }
}
</script>
</body>
</html>
