<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byway • Enjoy the Journey</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading { font-family: 'Playfair Display', sans-serif; }
        #map { height: 100vh; width: 100%; }
        .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .status-log { max-height: 220px; overflow-y: auto; font-size: 0.85rem; }
        .metric-bar { height: 8px; background: linear-gradient(90deg, #22c55e, #eab308); border-radius: 9999px; }
        .route-tab { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-96 bg-zinc-900 border-r border-zinc-800 flex flex-col overflow-hidden">
            <div class="p-6 border-b border-zinc-800">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-xl">🛣️</div>
                    <div>
                        <h1 class="heading text-3xl font-bold tracking-tight">Byway</h1>
                        <p class="text-emerald-400 text-sm">Feel the road</p>
                    </div>
                </div>
            </div>

            <div class="p-6 space-y-6 overflow-auto flex-1">
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-400">START</label>
                    <input id="start" type="text" value="Bristol, UK" 
                           class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3 focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-400">DESTINATION</label>
                    <input id="end" type="text" value="Bath, UK" 
                           class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3 focus:outline-none focus:border-emerald-500 text-white">
                </div>

                <button onclick="calculateRoutes()" 
                        class="w-full bg-white text-zinc-900 hover:bg-emerald-400 transition-all font-semibold py-4 rounded-3xl flex items-center justify-center gap-2 text-lg shadow-lg">
                    <i class="fas fa-magic"></i>
                    FIND ROUTES
                </button>

                <!-- Preferences -->
                <div>
                    <h3 class="font-semibold mb-4 flex items-center gap-2"><i class="fas fa-sliders-h"></i> Preferences</h3>
                    <div class="grid grid-cols-2 gap-3 text-sm" id="prefs"></div>
                </div>

                <!-- Status -->
                <div id="status-panel" class="hidden bg-zinc-950 border border-zinc-800 rounded-3xl p-5">
                    <h4 class="text-sm font-medium mb-3 flex items-center gap-2">
                        <i class="fas fa-spinner fa-spin"></i> Building Road Genome...
                    </h4>
                    <div id="status-log" class="status-log text-emerald-300/80 space-y-1 font-mono"></div>
                </div>

                <!-- Results Tabs -->
                <div id="results" class="hidden">
                    <div class="flex border-b border-zinc-800 mb-4">
                        <button onclick="switchRoute(0)" id="tab-0" class="route-tab flex-1 py-3 text-center border-b-2 border-emerald-500 font-medium">Fastest</button>
                        <button onclick="switchRoute(1)" id="tab-1" class="route-tab flex-1 py-3 text-center border-b-2 border-transparent hover:text-white">Best Byway</button>
                        <button onclick="switchRoute(2)" id="tab-2" class="route-tab flex-1 py-3 text-center border-b-2 border-transparent hover:text-white">Balanced</button>
                    </div>
                    <div id="route-details"></div>
                </div>
            </div>

            <div class="p-6 border-t border-zinc-800 text-xs text-zinc-500">
                Geoapify • Mock Genome v1 • Pilot: South West England
            </div>
        </div>

        <!-- Map -->
        <div class="flex-1 relative">
            <div id="map"></div>
            <div id="legend" class="absolute bottom-6 right-6 bg-zinc-900/95 backdrop-blur-md border border-zinc-700 rounded-3xl p-5 text-xs shadow-2xl hidden">
                <div class="flex gap-6">
                    <div><span class="inline-block w-4 h-1 bg-sky-500 rounded"></span> Fastest</div>
                    <div><span class="inline-block w-4 h-1 bg-emerald-500 rounded"></span> Byway Enjoyable</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "226000c0710244c891267056dc9a528b";
        let map, layers = { fast: null, byway: null, balanced: null };
        let allRoutes = [];
        let currentTab = 0;

        const preferencesList = [
            {id: 'scenic', label: 'Scenic', icon: '🌄', default: true},
            {id: 'history', label: 'History', icon: '🏛️', default: true},
            {id: 'driving', label: 'Driving Fun', icon: '🛣️', default: true},
            {id: 'food', label: 'Food & Drink', icon: '🍷', default: false},
            {id: 'adventure', label: 'Adventure', icon: '🏔️', default: false},
            {id: 'relax', label: 'Relax', icon: '🌿', default: false},
            {id: 'photo', label: 'Photography', icon: '📸', default: false}
        ];

        function initMap() {
            map = L.map('map').setView([51.45, -2.58], 10); // Bristol area
            L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey=${API_KEY}`, {
                attribution: '© OpenStreetMap © Geoapify',
                maxZoom: 19
            }).addTo(map);

            layers.fast = L.layerGroup().addTo(map);
            layers.byway = L.layerGroup().addTo(map);
            layers.balanced = L.layerGroup().addTo(map);
        }

        function addStatus(msg) {
            const log = document.getElementById('status-log');
            const entry = document.createElement('div');
            entry.textContent = `→ ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        async function geocode(query) {
            addStatus(`Geocoding ${query}...`);
            const res = await fetch(`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(query)}&apiKey=${API_KEY}`);
            const data = await res.json();
            if (!data.features?.[0]) throw new Error("Location not found");
            return data.features[0].geometry.coordinates;
        }

        async function getGeoapifyRoute(start, end, options = {}) {
            let url = `https://api.geoapify.com/v1/routing?waypoints=${start[1]},${start[0]}|${end[1]},${end[0]}&mode=drive&apiKey=${API_KEY}`;
            if (options.avoid) url += `&avoid=${options.avoid}`;
            if (options.type) url += `&type=${options.type}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("Routing failed");
            return await res.json();
        }

        function calculateMockGenome(coords) {
            const seed = coords[0] + coords[1];
            const r = (offset) => Math.abs(Math.sin(seed * 10 + offset) * 98765 % 1);
            return {
                water_exposure: r(1)*0.9, forest_exposure: r(2)*0.9, elevation_interest: r(3)*0.8+0.2,
                landscape_diversity: r(4)*0.85, viewpoint_density: r(5)*0.8, visual_drama: r(6)*0.9,
                curvature: r(7)*0.95, flow: r(8)*0.85, road_quality: 0.75 + r(9)*0.25,
                historic_density: r(10)*0.85, settlement_charm: r(11)*0.8, attraction_density: r(12)*0.7,
                food_density: r(13)*0.75, food_quality: r(14)*0.65+0.25,
                hidden_gem_score: r(15)*0.9, uniqueness_score: r(16)*0.85, remoteness_score: r(17)*0.8,
                traffic_stress: Math.max(0.1, 1 - r(18)*0.7), urban_intensity: 1 - r(19)*0.75,
                overall_confidence: 0.7 + r(20)*0.28
            };
        }

        function deriveScores(genome, prefs, bonus = 1.0) {
            const scenery = (genome.water_exposure*0.25 + genome.forest_exposure*0.25 + genome.elevation_interest*0.2 + 
                           genome.landscape_diversity*0.15 + genome.viewpoint_density*0.1 + genome.visual_drama*0.05);
            const driving = (genome.curvature*0.4 + genome.flow*0.3 + genome.road_quality*0.2 + (1-genome.urban_intensity)*0.1);
            const history = (genome.historic_density*0.5 + genome.settlement_charm*0.3 + genome.attraction_density*0.2);
            const discovery = (genome.hidden_gem_score*0.5 + genome.uniqueness_score*0.5);
            const food = (genome.food_density*0.6 + genome.food_quality*0.4);

            let experience = (scenery*0.35 + driving*0.25 + history*0.15 + discovery*0.15 + food*0.1) * bonus;
            
            let personal = experience;
            if (prefs.scenic) personal += scenery * 0.18;
            if (prefs.history) personal += history * 0.16;
            if (prefs.driving) personal += driving * 0.16;
            if (prefs.food) personal += food * 0.12;
            if (prefs.adventure) personal += (genome.remoteness_score + genome.visual_drama) * 0.12;
            if (prefs.relax) personal += (1 - genome.traffic_stress) * 0.12;
            if (prefs.photo) personal += (genome.viewpoint_density + genome.visual_drama) * 0.12;
            
            return {
                experienceScore: Math.max(45, Math.round(Math.min(99, experience * 100))),
                personalMatch: Math.max(50, Math.round(Math.min(99, personal * 100))),
                confidence: Math.round(genome.overall_confidence * 100),
                scenery: Math.round(scenery*100),
                driving_enjoyment: Math.round(driving*100),
                history_culture: Math.round(history*100),
                discovery: Math.round(discovery*100)
            };
        }

        function createPrefsUI() {
            const container = document.getElementById('prefs');
            container.innerHTML = '';
            preferencesList.forEach(p => {
                const el = document.createElement('div');
                el.className = `flex items-center gap-3 bg-zinc-800 rounded-2xl px-4 py-3 cursor-pointer transition-all ${p.default ? 'ring-2 ring-emerald-500' : ''}`;
                el.innerHTML = `
                    <span class="text-2xl">${p.icon}</span>
                    <span>${p.label}</span>
                    <input type="checkbox" id="${p.id}" ${p.default ? 'checked' : ''} class="ml-auto accent-emerald-500 w-5 h-5">
                `;
                container.appendChild(el);
            });
        }

        async function calculateRoutes() {
            // Clear previous
            Object.values(layers).forEach(l => l.clearLayers());
            document.getElementById('status-panel').classList.remove('hidden');
            document.getElementById('status-log').innerHTML = '';
            document.getElementById('legend').classList.add('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const startQ = document.getElementById('start').value || "Bristol, UK";
                const endQ = document.getElementById('end').value || "Bath, UK";
                
                const prefs = {};
                preferencesList.forEach(p => prefs[p.id] = document.getElementById(p.id).checked);

                const startCoords = await geocode(startQ);
                const endCoords = await geocode(endQ);

                addStatus("Fetching routes...");

                // 1. Fastest route
                const fastData = await getGeoapifyRoute(startCoords, endCoords, {type: "short"});
                allRoutes[0] = {data: fastData, type: "fast", name: "Fastest Route"};

                // 2. Byway "Best" - avoid highways for more scenic feel + higher mock bonus
                const scenicData = await getGeoapifyRoute(startCoords, endCoords, {avoid: "highways"});
                allRoutes[1] = {data: scenicData, type: "byway", name: "Best Byway"};

                // 3. Balanced
                const balancedData = await getGeoapifyRoute(startCoords, endCoords, {type: "balanced"});
                allRoutes[2] = {data: balancedData, type: "balanced", name: "Balanced"};

                addStatus("Scoring atomic segments...");

                // Process and score each route
                allRoutes.forEach((routeInfo, idx) => {
                    const coordsList = routeInfo.data.features[0].geometry.coordinates;
                    routeInfo.scoredSegments = coordsList.map((seg, i) => {
                        const genome = calculateMockGenome(seg);
                        // Give Byway route a natural bonus in scoring
                        const bonus = routeInfo.type === "byway" ? 1.18 : (routeInfo.type === "balanced" ? 1.08 : 1.0);
                        const scores = deriveScores(genome, prefs, bonus);
                        return {geometry: seg, scores, genome};
                    });

                    const avgExp = Math.round(routeInfo.scoredSegments.reduce((a, s) => a + s.scores.experienceScore, 0) / routeInfo.scoredSegments.length);
                    const avgPers = Math.round(routeInfo.scoredSegments.reduce((a, s) => a + s.scores.personalMatch, 0) / routeInfo.scoredSegments.length);
                    routeInfo.overall = {experience: avgExp, personal: avgPers};
                });

                document.getElementById('legend').classList.remove('hidden');
                document.getElementById('results').classList.remove('hidden');
                document.getElementById('status-panel').classList.add('hidden');

                switchRoute(1); // Default to Best Byway

            } catch (e) {
                console.error(e);
                addStatus(`Error: ${e.message}. Try different locations.`);
            }
        }

        function drawRoute(routeInfo, layer, color) {
            layer.clearLayers();
            routeInfo.scoredSegments.forEach((s, i) => {
                const exp = s.scores.experienceScore;
                const segColor = exp > 80 ? '#10b981' : (exp > 65 ? '#eab308' : '#f43f5e');
                L.polyline(s.geometry, {color: color || segColor, weight: 6.5, opacity: 0.85})
                    .addTo(layer)
                    .bindPopup(`
                        <div class="p-4">
                            <strong>Segment ${i+1}</strong><br>
                            Experience: <b>${s.scores.experienceScore}</b>/100<br>
                            Personal: <b>${s.scores.personalMatch}</b>/100<br>
                            Confidence: ${s.scores.confidence}%
                        </div>
                    `);
            });
        }

        function switchRoute(tab) {
            currentTab = tab;
            // Hide all layers
            Object.values(layers).forEach(l => l.clearLayers());
            
            const routeInfo = allRoutes[tab];
            if (!routeInfo) return;

            const layer = layers[routeInfo.type === "fast" ? "fast" : (routeInfo.type === "byway" ? "byway" : "balanced")];
            drawRoute(routeInfo, layer, tab === 0 ? "#3b82f6" : "#10b981");

            // Render details
            const html = `
                <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-700">
                    <div class="flex justify-between">
                        <div>
                            <div class="uppercase text-xs tracking-widest text-emerald-400">${routeInfo.name}</div>
                            <div class="text-6xl heading font-bold text-white mt-2">${routeInfo.overall.experience}<span class="text-3xl">/100</span></div>
                            <div class="text-zinc-400">Experience Score</div>
                        </div>
                        <div class="text-right">
                            <div class="text-5xl font-semibold text-amber-400">${routeInfo.overall.personal}</div>
                            <div class="text-sm text-zinc-400">Personal Match</div>
                        </div>
                    </div>
                    
                    <div class="mt-8 grid grid-cols-2 gap-6">
                        <div>
                            <div class="flex justify-between text-xs mb-2"><span>Scenery</span><span class="font-mono">${routeInfo.scoredSegments[0].scores.scenery}</span></div>
                            <div class="metric-bar w-[${routeInfo.scoredSegments[0].scores.scenery}%]"></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-2"><span>Driving</span><span class="font-mono">${routeInfo.scoredSegments[0].scores.driving_enjoyment}</span></div>
                            <div class="metric-bar w-[${routeInfo.scoredSegments[0].scores.driving_enjoyment}%]"></div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('route-details').innerHTML = html;

            // Update active tab
            for (let i = 0; i < 3; i++) {
                const tabEl = document.getElementById(`tab-${i}`);
                tabEl.classList.toggle('border-emerald-500', i === tab);
                tabEl.classList.toggle('border-transparent', i !== tab);
            }
        }

        window.onload = () => {
            initMap();
            createPrefsUI();
            // Auto demo
            setTimeout(calculateRoutes, 800);
        };
    </script>
</body>
</html>
