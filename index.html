<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byway MVP v2</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8}
.header{background:white;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select,button{padding:12px;border-radius:10px;border:1px solid #ccc}
input{flex:1;min-width:220px}
button{background:#111827;color:#fff;cursor:pointer}
#map{height:55vh}
.wrap{padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:white;padding:16px;border-radius:12px}
.big{font-size:28px;font-weight:bold}
pre{background:white;padding:12px;border-radius:12px;overflow:auto;max-height:400px}
</style>
</head>
<body>
<div class="header">
<h2>Byway MVP v2</h2>
<div class="row">
<input id="origin" value="Tillington, West Sussex">
<input id="destination" value="Bath">
<select id="theme">
<option>Scenic</option>
<option>History</option>
<option>Food</option>
<option>Discovery</option>
<option>Relaxation</option>
</select>
<button onclick="run()">Generate Route</button>
</div>
<div id="status">Ready</div>
</div>

<div id="map"></div>

<div class="wrap">
<div class="cards">
<div class="card"><div>Experience</div><div id="exp" class="big">--</div></div>
<div class="card"><div>Confidence</div><div id="conf" class="big">--</div></div>
<div class="card"><div>Segments</div><div id="segs" class="big">--</div></div>
</div>
<h3>Genome Output</h3>
<pre id="out"></pre>
</div>

<script>
const API_KEY="226000c0710244c891267056dc9a528b";

const map=new maplibregl.Map({
 container:"map",
 style:`https://maps.geoapify.com/v1/styles/osm-carto/style.json?apiKey=${API_KEY}`,
 center:[-2,52],zoom:6
});

async function geocode(q){
 const r=await fetch(`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(q)}&limit=1&apiKey=${API_KEY}`);
 const j=await r.json();
 if(!j.features?.length) throw new Error("Location not found: "+q);
 return j.features[0].properties;
}

function dist(a,b){
 const R=6371000;
 const dLat=(b[1]-a[1])*Math.PI/180;
 const dLon=(b[0]-a[0])*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.sin(dLon/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function split(coords,target=500){
 let s=[],c=[coords[0]],m=0;
 for(let i=0;i<coords.length-1;i++){
   m+=dist(coords[i],coords[i+1]);
   c.push(coords[i+1]);
   if(m>=target){s.push(c);c=[coords[i+1]];m=0;}
 }
 if(c.length>1)s.push(c);
 return s;
}

async function places(cat,lon,lat){
 try{
  const u=`https://api.geoapify.com/v2/places?categories=${cat}&filter=circle:${lon},${lat},1000&limit=20&apiKey=${API_KEY}`;
  const j=await (await fetch(u)).json();
  return j.features?.length || 0;
 }catch{return 0;}
}

async function getRoute(start,end){
 const url=`https://api.geoapify.com/v1/routing?waypoints=${start.lat},${start.lon}|${end.lat},${end.lon}&mode=drive&details=route_details&apiKey=${API_KEY}`;
 const j=await (await fetch(url)).json();

 let coords=null;

 if(j.features?.[0]?.geometry?.coordinates){
   coords=j.features[0].geometry.coordinates;
 }
 else if(j.results?.[0]?.geometry?.coordinates){
   coords=j.results[0].geometry.coordinates;
 }

 if(!coords){
   console.log(j);
   throw new Error("Routing geometry missing. Check browser console.");
 }

 return coords;
}

async function run(){
 try{
  status.textContent="Geocoding...";
  const start=await geocode(origin.value);
  const end=await geocode(destination.value);

  status.textContent="Routing...";
  const coords=await getRoute(start,end);

  if(map.getLayer("route")) map.removeLayer("route");
  if(map.getSource("route")) map.removeSource("route");

  map.addSource("route",{
   type:"geojson",
   data:{type:"Feature",geometry:{type:"LineString",coordinates:coords}}
  });

  map.addLayer({
   id:"route",
   type:"line",
   source:"route",
   paint:{"line-width":6}
  });

  const bounds=new maplibregl.LngLatBounds();
  coords.forEach(c=>bounds.extend(c));
  map.fitBounds(bounds,{padding:50});

  const segments=split(coords);
  const genomes=[];

  for(let i=0;i<segments.length;i++){
    status.textContent=`Analyzing ${i+1}/${segments.length}`;

    const mid=segments[i][Math.floor(segments[i].length/2)];
    const food=await places("catering.restaurant",mid[0],mid[1]);
    const history=await places("heritage",mid[0],mid[1]);
    const tourism=await places("tourism",mid[0],mid[1]);

    let score=(food*2)+(history*4)+(tourism*2);
    if(theme.value==="History") score+=history*5;
    if(theme.value==="Food") score+=food*5;
    if(theme.value==="Discovery") score+=tourism*4;

    genomes.push({
      segment_id:"segment_"+i,
      metrics:{
        food_density:food,
        historic_density:history,
        attraction_density:tourism
      },
      experience_score:Math.min(100,Math.round(score))
    });
  }

  const avg=Math.round(genomes.reduce((a,b)=>a+b.experience_score,0)/Math.max(genomes.length,1));

  exp.textContent=avg+"/100";
  conf.textContent="75%";
  segs.textContent=segments.length;
  out.textContent=JSON.stringify(genomes,null,2);
  status.textContent="Done";

 }catch(e){
  console.error(e);
  status.textContent=e.message;
 }
}
</script>
</body>
</html>
