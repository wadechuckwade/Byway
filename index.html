<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byway • Enjoy the Journey</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading { font-family: 'Playfair Display', sans-serif; }
        #map { height: 100vh; width: 100%; }
        .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .status-log { max-height: 200px; overflow-y: auto; font-size: 0.85rem; }
        .metric-bar { height: 6px; background: linear-gradient(90deg, #22c55e, #eab308); border-radius: 9999px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-96 bg-zinc-900 border-r border-zinc-800 flex flex-col overflow-hidden">
            <!-- Header -->
            <div class="p-6 border-b border-zinc-800">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-xl">🛣️</div>
                    <div>
                        <h1 class="heading text-3xl font-bold tracking-tight">Byway</h1>
                        <p class="text-emerald-400 text-sm">Feel the road</p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="p-6 space-y-6 overflow-auto flex-1">
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-400">START</label>
                    <input id="start" type="text" value="Bath, UK" 
                           class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3 focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-400">DESTINATION</label>
                    <input id="end" type="text" value="Castle Combe, UK" 
                           class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3 focus:outline-none focus:border-emerald-500 text-white">
                </div>

                <button onclick="calculateRoutes()" 
                        class="w-full bg-white text-zinc-900 hover:bg-emerald-400 transition-all font-semibold py-4 rounded-3xl flex items-center justify-center gap-2 text-lg">
                    <i class="fas fa-magic"></i>
                    FIND ENJOYABLE ROUTE
                </button>

                <!-- Preferences -->
                <div>
                    <h3 class="font-semibold mb-4 flex items-center gap-2"><i class="fas fa-sliders-h"></i> Your Journey Preferences</h3>
                    <div class="grid grid-cols-2 gap-3 text-sm" id="prefs">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Status -->
                <div id="status-panel" class="hidden bg-zinc-950 border border-zinc-800 rounded-3xl p-5">
                    <h4 class="text-sm font-medium mb-3 flex items-center gap-2">
                        <i class="fas fa-spinner fa-spin"></i> 
                        Building Your Road Genome...
                    </h4>
                    <div id="status-log" class="status-log text-emerald-300/80 space-y-1"></div>
                </div>

                <!-- Results -->
                <div id="results" class="hidden space-y-6"></div>
            </div>

            <div class="p-6 border-t border-zinc-800 text-xs text-zinc-500">
                Powered by Geoapify • Mock Genome v1 • Pilot: Cotswolds
            </div>
        </div>

        <!-- Map -->
        <div class="flex-1 relative" id="map-container">
            <div id="map"></div>
            
            <!-- Floating Legend -->
            <div class="absolute bottom-6 right-6 bg-zinc-900/90 backdrop-blur-md border border-zinc-700 rounded-3xl p-4 text-xs hidden" id="legend">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-1 bg-emerald-500 rounded"></div>
                        <span>High Enjoyment</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-1 bg-amber-500 rounded"></div>
                        <span>Good</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "226000c0710244c891267056dc9a528b";
        let map, routeLayer, bywayLayer;
        let currentScoredSegments = [];

        const preferencesList = [
            {id: 'scenic', label: 'Scenic Beauty', icon: '🌄', default: true},
            {id: 'history', label: 'History & Culture', icon: '🏛️', default: true},
            {id: 'driving', label: 'Driving Enjoyment', icon: '🛣️', default: true},
            {id: 'food', label: 'Food & Drink', icon: '🍷', default: false},
            {id: 'adventure', label: 'Adventure', icon: '🏔️', default: false},
            {id: 'relax', label: 'Relaxation', icon: '🌿', default: false},
            {id: 'photo', label: 'Photography', icon: '📸', default: false}
        ];

        function initTailwind() {
            // Tailwind already loaded via CDN
        }

        function initMap() {
            map = L.map('map', { zoomControl: true }).setView([51.38, -2.36], 13);
            L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey=${API_KEY}`, {
                attribution: '&copy; OpenStreetMap & Geoapify',
                maxZoom: 19
            }).addTo(map);

            routeLayer = L.layerGroup().addTo(map);
            bywayLayer = L.layerGroup().addTo(map);
        }

        function addStatus(message) {
            const log = document.getElementById('status-log');
            const entry = document.createElement('div');
            entry.textContent = `→ ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        async function geocode(query) {
            addStatus(`Geocoding "${query}"...`);
            const res = await fetch(`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(query)}&apiKey=${API_KEY}`);
            const data = await res.json();
            if (!data.features?.length) throw new Error("Location not found");
            return data.features[0].geometry.coordinates;
        }

        async function getRoute(start, end) {
            addStatus('Fetching base route from Geoapify...');
            const url = `https://api.geoapify.com/v1/routing?waypoints=${start[1]},${start[0]}|${end[1]},${end[0]}&mode=drive&apiKey=${API_KEY}`;
            const res = await fetch(url);
            return await res.json();
        }

        function calculateMockGenome(coords) {
            const seed = coords[0] + coords[1] + coords.length;
            const r = (s) => Math.abs(Math.sin(seed + s) * 9876 % 1);
            
            return {
                water_exposure: r(1) * 0.95,
                forest_exposure: r(2) * 0.9,
                elevation_interest: r(3) * 0.85 + 0.15,
                landscape_diversity: r(4) * 0.8 + 0.2,
                viewpoint_density: r(5) * 0.75,
                visual_drama: r(6) * 0.9,
                curvature: r(7) * 0.95,
                flow: r(8) * 0.85,
                road_quality: 0.7 + r(9) * 0.3,
                historic_density: r(10) * 0.8,
                settlement_charm: r(11) * 0.75,
                attraction_density: r(12) * 0.65,
                food_density: r(13) * 0.7,
                food_quality: r(14) * 0.6 + 0.3,
                hidden_gem_score: r(15) * 0.85,
                uniqueness_score: r(16) * 0.8,
                remoteness_score: r(17) * 0.75 + 0.1,
                traffic_stress: 1 - r(18) * 0.6,
                urban_intensity: 1 - r(19) * 0.7,
                overall_confidence: 0.68 + r(20) * 0.3
            };
        }

        function deriveScores(genome, prefs) {
            const scenery = (genome.water_exposure * 0.25 + genome.forest_exposure * 0.25 + 
                           genome.elevation_interest * 0.2 + genome.landscape_diversity * 0.15 + 
                           genome.viewpoint_density * 0.1 + genome.visual_drama * 0.05);
            
            const driving_enjoyment = (genome.curvature * 0.4 + genome.flow * 0.3 + 
                                     genome.road_quality * 0.2 + (1 - genome.urban_intensity) * 0.1);
            
            const history_culture = (genome.historic_density * 0.5 + genome.settlement_charm * 0.3 + genome.attraction_density * 0.2);
            const food_drink = (genome.food_density * 0.6 + genome.food_quality * 0.4);
            const discovery = (genome.hidden_gem_score * 0.5 + genome.uniqueness_score * 0.5);
            
            let experience = (scenery * 0.35 + driving_enjoyment * 0.25 + history_culture * 0.15 + 
                            discovery * 0.15 + food_drink * 0.1);
            
            // Personal match
            let personal = experience;
            if (prefs.scenic) personal += scenery * 0.15;
            if (prefs.history) personal += history_culture * 0.15;
            if (prefs.driving) personal += driving_enjoyment * 0.15;
            if (prefs.food) personal += food_drink * 0.1;
            if (prefs.adventure) personal += (genome.remoteness_score + genome.visual_drama) * 0.1;
            if (prefs.relax) personal += (1 - genome.traffic_stress) * 0.1;
            if (prefs.photo) personal += (genome.viewpoint_density + genome.visual_drama) * 0.1;
            
            personal = Math.min(1, personal * 1.1);
            
            const emotional = [];
            if (scenery > 0.75) emotional.push("Epic");
            if (driving_enjoyment > 0.7 && genome.curvature > 0.6) emotional.push("Exciting");
            if (history_culture > 0.65) emotional.push("Romantic");
            if (genome.traffic_stress < 0.3) emotional.push("Meditative");
            
            return {
                experienceScore: Math.round(experience * 100),
                personalMatch: Math.round(personal * 100),
                confidence: Math.round(genome.overall_confidence * 100),
                scenery: Math.round(scenery * 100),
                driving_enjoyment: Math.round(driving_enjoyment * 100),
                history_culture: Math.round(history_culture * 100),
                food_drink: Math.round(food_drink * 100),
                discovery: Math.round(discovery * 100),
                emotional
            };
        }

        function createPrefsUI() {
            const container = document.getElementById('prefs');
            container.innerHTML = '';
            preferencesList.forEach(pref => {
                const div = document.createElement('div');
                div.className = `flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-2xl px-4 py-3 cursor-pointer ${pref.default ? 'ring-2 ring-emerald-500' : ''}`;
                div.innerHTML = `
                    <span class="text-xl">${pref.icon}</span>
                    <span class="font-medium">${pref.label}</span>
                    <input type="checkbox" id="${pref.id}" ${pref.default ? 'checked' : ''} class="ml-auto accent-emerald-500">
                `;
                container.appendChild(div);
            });
        }

        async function calculateRoutes() {
            routeLayer.clearLayers();
            bywayLayer.clearLayers();
            document.getElementById('results').classList.add('hidden');
            const statusPanel = document.getElementById('status-panel');
            statusPanel.classList.remove('hidden');
            document.getElementById('status-log').innerHTML = '';
            document.getElementById('legend').classList.remove('hidden');

            try {
                const startQuery = document.getElementById('start').value || "Bath, UK";
                const endQuery = document.getElementById('end').value || "Castle Combe, UK";

                const prefs = {};
                preferencesList.forEach(p => {
                    prefs[p.id] = document.getElementById(p.id).checked;
                });

                const startCoords = await geocode(startQuery);
                const endCoords = await geocode(endQuery);

                // Fast route
                addStatus('Calculating fastest route...');
                const fastRouteData = await getRoute(startCoords, endCoords);
                L.geoJSON(fastRouteData, {
                    style: { color: '#64748b', weight: 5, opacity: 0.6, dashArray: '8,6' }
                }).addTo(routeLayer).bindPopup('<strong>Fastest Route</strong><br>Google-style priority');

                // Byway route
                addStatus('Generating Byway enjoyable route...');
                const bywayRouteData = await getRoute(startCoords, endCoords);

                addStatus('Splitting into atomic segments (~300m)...');
                const coordinates = bywayRouteData.features[0].geometry.coordinates;
                currentScoredSegments = coordinates.map((seg, i) => {
                    const genome = calculateMockGenome(seg);
                    const scores = deriveScores(genome, prefs);
                    return { geometry: seg, genome, scores, index: i };
                });

                addStatus('Applying derived categories & emotional analysis...');
                
                // Draw colored segments
                currentScoredSegments.forEach(s => {
                    const hue = s.scores.experienceScore > 80 ? '#10b981' : (s.scores.experienceScore > 60 ? '#eab308' : '#f43f5e');
                    L.polyline([s.geometry], { 
                        color: hue, 
                        weight: 7, 
                        opacity: 0.9 
                    }).addTo(bywayLayer)
                      .bindPopup(`
                        <div class="p-3 max-w-xs">
                            <strong class="block text-lg">Atomic Segment ${s.index + 1}</strong>
                            <div class="my-3 grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
                                <div>Scenery</div><div class="text-right font-mono">${s.scores.scenery}</div>
                                <div>Driving</div><div class="text-right font-mono">${s.scores.driving_enjoyment}</div>
                                <div>History</div><div class="text-right font-mono">${s.scores.history_culture}</div>
                                <div>Discovery</div><div class="text-right font-mono">${s.scores.discovery}</div>
                            </div>
                            <div class="text-xs text-emerald-400">Confidence: ${s.scores.confidence}%</div>
                            ${s.scores.emotional.length ? `<div class="mt-2 flex gap-1">${s.scores.emotional.map(e => `<span class="inline-block bg-emerald-900 text-emerald-300 text-[10px] px-2 py-0.5 rounded-full">${e}</span>`).join('')}</div>` : ''}
                        </div>
                      `);
                });

                // Overall scores
                const avgExperience = Math.round(currentScoredSegments.reduce((sum, s) => sum + s.scores.experienceScore, 0) / currentScoredSegments.length);
                const avgPersonal = Math.round(currentScoredSegments.reduce((sum, s) => sum + s.scores.personalMatch, 0) / currentScoredSegments.length);
                const avgConfidence = Math.round(currentScoredSegments.reduce((sum, s) => sum + s.scores.confidence, 0) / currentScoredSegments.length);

                // Render results panel
                const resultsHTML = `
                    <div class="bg-zinc-900 border border-emerald-900 rounded-3xl p-6">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <div class="text-emerald-400 text-sm tracking-widest">BYWAY RECOMMENDATION</div>
                                <div class="text-5xl font-semibold heading mt-1">${avgExperience}<span class="text-2xl">/100</span></div>
                                <div class="text-zinc-400">Experience Score</div>
                            </div>
                            <div class="text-right">
                                <div class="text-4xl font-semibold text-amber-400">${avgPersonal}</div>
                                <div class="text-sm text-zinc-400">Personal Match</div>
                            </div>
                        </div>
                        
                        <div class="space-y-5">
                            <div>
                                <div class="flex justify-between text-xs mb-1.5"><span>Scenery</span><span class="font-mono">${currentScoredSegments[0].scores.scenery}</span></div>
                                <div class="metric-bar" style="width: ${currentScoredSegments[0].scores.scenery}%"></div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs mb-1.5"><span>Driving Enjoyment</span><span class="font-mono">${currentScoredSegments[0].scores.driving_enjoyment}</span></div>
                                <div class="metric-bar" style="width: ${currentScoredSegments[0].scores.driving_enjoyment}%"></div>
                            </div>
                        </div>

                        <div class="mt-8 pt-6 border-t border-zinc-800 text-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-zinc-400">Confidence</span>
                                <span class="font-mono text-emerald-400">${avgConfidence}%</span>
                            </div>
                            ${currentScoredSegments[0].scores.emotional.length ? `<div class="mt-4 flex flex-wrap gap-2">${currentScoredSegments[0].scores.emotional.map(e => `<span class="bg-zinc-800 px-3 py-1 rounded-2xl text-xs">${e}</span>`).join('')}</div>` : ''}
                        </div>
                    </div>
                    
                    <button onclick="showGenomeExport()" class="w-full mt-4 text-sm py-3 border border-zinc-700 hover:border-white rounded-3xl transition-colors">
                        📊 Export Full Genome Data (GeoJSON)
                    </button>
                `;

                document.getElementById('results').innerHTML = resultsHTML;
                document.getElementById('results').classList.remove('hidden');
                addStatus('✅ Route complete. Segments scored.');

            } catch (e) {
                console.error(e);
                addStatus(`❌ Error: ${e.message}`);
            }
        }

        function showGenomeExport() {
            alert("In a full version this would download a detailed GeoJSON with all atomic segment genomes.\n\nDemo limitation: Full static genome builder would live in Python backend.");
        }

        // Initialize
        window.onload = () => {
            initTailwind();
            initMap();
            createPrefsUI();
            
            // Auto demo
            setTimeout(() => {
                calculateRoutes();
            }, 1200);
        };
    </script>
</body>
</html>
