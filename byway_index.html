<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byway Prototype</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#f6f7f9;
color:#1f2937;
}
.hero{
padding:28px;
background:white;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}
h1{margin:0 0 8px 0}
.sub{color:#666;margin-bottom:20px}
.controls{
display:grid;
grid-template-columns:1fr 1fr 180px 180px;
gap:12px;
}
input,select,button{
padding:14px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:15px;
}
button{
background:#111827;
color:white;
cursor:pointer;
}
button:hover{opacity:.92}
#status{
padding:12px 28px;
font-weight:bold;
}
#map{
height:55vh;
}
.panel{
padding:20px;
}
textarea{
width:100%;
height:320px;
border-radius:10px;
padding:12px;
border:1px solid #d1d5db;
font-family:monospace;
}
.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:16px;
}
.card{
background:white;
padding:16px;
border-radius:12px;
box-shadow:0 1px 6px rgba(0,0,0,.06);
}
.big{
font-size:26px;
font-weight:bold;
}
@media(max-width:900px){
.controls,.cards{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="hero">
<h1>Byway</h1>
<div class="sub">Journey-first route intelligence prototype</div>

<div class="controls">
<input id="origin" value="Tillington, West Sussex" placeholder="Starting location">
<input id="destination" value="Bath" placeholder="Destination">
<select id="theme">
<option>Scenic</option>
<option>History</option>
<option>Food</option>
<option>Discovery</option>
<option>Relaxation</option>
</select>
<button onclick="run()">Generate Route</button>
</div>
</div>

<div id="status">Ready</div>
<div id="map"></div>

<div class="panel">
<div class="cards">
<div class="card">
<div>Experience Score</div>
<div id="experience" class="big">--</div>
</div>
<div class="card">
<div>Confidence</div>
<div id="confidence" class="big">--</div>
</div>
<div class="card">
<div>Segments</div>
<div id="segments" class="big">--</div>
</div>
</div>

<textarea id="output"></textarea>
</div>

<script>
const API_KEY="226000c0710244c891267056dc9a528b";

const map = new maplibregl.Map({
 container:'map',
 style:`https://maps.geoapify.com/v1/styles/osm-carto/style.json?apiKey=${API_KEY}`,
 center:[-1.5,52],
 zoom:6
});

async function geocode(place){
 const url=`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(place)}&limit=1&apiKey=${API_KEY}`;
 const r=await fetch(url);
 const j=await r.json();
 if(!j.features || !j.features.length) throw new Error("Location not found: "+place);

 return {
  lat:j.features[0].properties.lat,
  lon:j.features[0].properties.lon
 };
}

function hav(lat1,lon1,lat2,lon2){
 const R=6371000;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
 return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function splitRoute(coords,target=500){
 let segs=[],cur=[coords[0]],len=0;

 for(let i=0;i<coords.length-1;i++){
   const d=hav(coords[i][1],coords[i][0],coords[i+1][1],coords[i+1][0]);
   cur.push(coords[i+1]);
   len+=d;

   if(len>=target){
      segs.push(cur);
      cur=[coords[i+1]];
      len=0;
   }
 }
 if(cur.length>1) segs.push(cur);
 return segs;
}

async function countPlaces(category,lon,lat){
 try{
  const url=`https://api.geoapify.com/v2/places?categories=${category}&filter=circle:${lon},${lat},1000&limit=30&apiKey=${API_KEY}`;
  const j=await (await fetch(url)).json();
  return (j.features||[]).length;
 }catch(e){
  return 0;
 }
}

async function elevation(lat,lon){
 try{
  const j=await (await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lon}`)).json();
  return j.results?.[0]?.elevation || 0;
 }catch{
  return 0;
 }
}

async function genome(seg,id,theme){
 const mid=seg[Math.floor(seg.length/2)];
 const lon=mid[0];
 const lat=mid[1];

 const food=await countPlaces("catering.restaurant",lon,lat);
 const history=await countPlaces("heritage",lon,lat);
 const tourism=await countPlaces("tourism",lon,lat);
 const elev=await elevation(lat,lon);

 let experience=(food*2)+(history*3)+(tourism*2)+(elev/100);

 if(theme==="Scenic") experience += elev/20;
 if(theme==="History") experience += history*5;
 if(theme==="Food") experience += food*5;
 if(theme==="Discovery") experience += tourism*4;

 experience=Math.min(100,Math.round(experience));

 return {
   segment_id:id,
   metrics:{
      food_density:food,
      historic_density:history,
      attraction_density:tourism,
      elevation_interest:elev
   },
   experience_score:experience,
   confidence:0.75
 };
}

async function run(){

 try{

 document.getElementById("status").innerText="Geocoding...";

 const start=await geocode(document.getElementById("origin").value);
 const end=await geocode(document.getElementById("destination").value);
 const theme=document.getElementById("theme").value;

 document.getElementById("status").innerText="Routing...";

 const routeUrl=`https://api.geoapify.com/v1/routing?waypoints=${start.lat},${start.lon}|${end.lat},${end.lon}&mode=drive&format=json&apiKey=${API_KEY}`;

 const route=await (await fetch(routeUrl)).json();

 const coords=route.results[0].geometry.coordinates;

 if(map.getSource("route")){
  map.removeLayer("route");
  map.removeSource("route");
 }

 map.addSource("route",{
  type:"geojson",
  data:{
   type:"Feature",
   geometry:{
    type:"LineString",
    coordinates:coords
   }
  }
 });

 map.addLayer({
  id:"route",
  type:"line",
  source:"route",
  paint:{
   "line-width":6
  }
 });

 const bounds=new maplibregl.LngLatBounds();
 coords.forEach(c=>bounds.extend(c));
 map.fitBounds(bounds,{padding:50});

 const segs=splitRoute(coords,500);
 const genomes=[];

 for(let i=0;i<segs.length;i++){
   document.getElementById("status").innerText=`Analyzing ${i+1}/${segs.length}`;
   genomes.push(await genome(segs[i],`segment_${i}`,theme));
 }

 const avg=Math.round(
   genomes.reduce((a,b)=>a+b.experience_score,0)/genomes.length
 );

 document.getElementById("experience").innerText=avg+"/100";
 document.getElementById("confidence").innerText="75%";
 document.getElementById("segments").innerText=genomes.length;

 document.getElementById("output").value=JSON.stringify(genomes,null,2);

 document.getElementById("status").innerText="Route generated";

 }catch(err){
   document.getElementById("status").innerText=err.message;
   console.error(err);
 }
}
</script>
</body>
</html>
